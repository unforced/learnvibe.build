name = "learnvibe-build"
main = "src/index.tsx"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "learnvibe-db"
database_id = "3d67d43b-4840-4f33-a297-83d94f355a20"
migrations_dir = "drizzle/migrations"

# Cloudflare Email Service — transactional send binding (env.EMAIL).
# The `from` domain (learnvibe.build) must be onboarded in the dashboard:
# Email → Email Sending, with DKIM/SPF/DMARC records on the zone.
[[send_email]]
name = "EMAIL"

[vars]
EMAIL_FROM = "Learn Vibe Build <hello@learnvibe.build>"
EMAIL_REPLY_TO = "ag@unforced.dev"

# Custom domain
[[routes]]
pattern = "learnvibe.build"
custom_domain = true
